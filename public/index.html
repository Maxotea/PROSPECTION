<!doctype html>
<html lang="fr">
<head>

  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">

  <title>OTEA Moteur</title>

  <!-- Les icônes de l'app : un seul trait, dessinées une fois, réutilisées partout. -->

    <defs>

      <symbol id="i-campagnes" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="2.2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M7.5 14h3M13.5 14h3M7.5 17.5h3"/></symbol>

  <a class="lien-evitement" href="#view">Aller au contenu</a>

  <div id="app">
    <nav id="sidebar" aria-label="Navigation principale">
      <div class="nav-tete">
        <a class="logo" href="#/journee" aria-label="OTEA Moteur, retour à Ma journée">
          <span class="logo-mark" aria-hidden="true"><svg class="ico"><use href="#i-chasse"/></svg></span>
          <span class="logo-texte">OTEA <b>Moteur</b></span>
        </a>
        <button class="ghost ico-btn" id="nav-replier" type="button" aria-label="Replier le menu" title="Replier le menu"><svg class="ico" aria-hidden="true"><use href="#i-replier"/></svg></button>
      </div>
      <button class="nav-recherche" id="nav-palette" type="button" aria-label="Rechercher ou aller à un écran (Ctrl K)">
        <svg class="ico" aria-hidden="true"><use href="#i-loupe"/></svg><span>Rechercher, aller à…</span><kbd class="kbd-cmd" aria-hidden="true">⌘K</kbd>
      </button>
      <a href="#/journee" data-view="journee" data-court="Journée"><svg class="ico" aria-hidden="true"><use href="#i-journee"/></svg><span>Ma journée</span></a>
      <a href="#/qg" data-view="qg" data-court="QG"><svg class="ico" aria-hidden="true"><use href="#i-qg"/></svg><span>Quartier général</span></a>
      <div class="nav-groupe" aria-hidden="true">Prospection</div>
      <a href="#/chasse" data-view="chasse" data-court="Chasse"><svg class="ico" aria-hidden="true"><use href="#i-chasse"/></svg><span>La Chasse</span></a>
      <a href="#/autopilot" data-view="autopilot" data-court="Pilote"><svg class="ico" aria-hidden="true"><use href="#i-autopilot"/></svg><span>Autopilote</span></a>
      <a href="#/campagnes" data-view="campagnes" data-court="Campagnes"><svg class="ico" aria-hidden="true"><use href="#i-campagnes"/></svg><span>Campagnes</span></a>
      <div class="nav-groupe" aria-hidden="true">CRM</div>
      <a href="#/pipeline" data-view="pipeline" data-court="Pipeline"><svg class="ico" aria-hidden="true"><use href="#i-pipeline"/></svg><span>Pipeline</span></a>
      <a href="#/contacts" data-view="contacts" data-court="Contacts"><svg class="ico" aria-hidden="true"><use href="#i-contacts"/></svg><span>Contacts</span></a>
      <a href="#/inbox" data-view="inbox" data-court="Réponses"><svg class="ico" aria-hidden="true"><use href="#i-inbox"/></svg><span>Réponses</span></a>
      <div class="nav-groupe" aria-hidden="true">Outils</div>
      <a href="#/import" data-view="import" data-court="Imports"><svg class="ico" aria-hidden="true"><use href="#i-import"/></svg><span>Imports</span></a>
      <a href="#/reglages" data-view="reglages" data-court="Réglages"><svg class="ico" aria-hidden="true"><use href="#i-reglages"/></svg><span>Réglages</span></a>

        <div id="side-level"></div>
        <div class="nav-outils">

        </div>
      </div>
    </nav>
    <main id="view" aria-live="polite" tabindex="-1"></main>
  </div>

  <!-- Téléphone : les moteurs du quotidien sous le pouce, le reste derrière « Plus ». -->
  <nav id="tabbar" aria-label="Navigation rapide">
    <a href="#/journee" data-view="journee"><svg class="ico" aria-hidden="true"><use href="#i-journee"/></svg><span>Journée</span></a>
    <a href="#/chasse" data-view="chasse"><svg class="ico" aria-hidden="true"><use href="#i-chasse"/></svg><span>Chasse</span></a>
    <a href="#/contacts" data-view="contacts"><svg class="ico" aria-hidden="true"><use href="#i-contacts"/></svg><span>Contacts</span></a>
    <a href="#/autopilot" data-view="autopilot"><svg class="ico" aria-hidden="true"><use href="#i-autopilot"/></svg><span>Pilote</span></a>
    <button type="button" id="tab-plus" aria-haspopup="true" aria-expanded="false" aria-controls="sidebar"><svg class="ico" aria-hidden="true"><use href="#i-menu"/></svg><span>Plus</span></button>

  <div id="toasts" role="status" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="/game.js"></script>
  <script src="/journee.js"></script>
  <script src="/app.js"></script>
  <script src="/ui.js"></script>
